{% extends 'base.html' %}
{% block content %}
<section class="lab-profile-card"><div class="lab-profile-tabs"><span class="active">회원정보 수정하기</span><span>비밀번호 변경하기</span></div><form id="profile-form" data-profile-id="{{ profile_user_id }}"><label>아이디 (변경 불가능)<input id="profile-username" disabled></label><label>이름 (변경 불가능)<input id="profile-display-name" disabled></label><label>이메일<input id="profile-email" type="email" name="email" maxlength="254" autocomplete="email"></label><label>전화번호를 입력해주세요. ex)010-0000-0000<input id="profile-phone" name="phone" maxlength="20" pattern="[0-9-]*" autocomplete="tel"></label><button type="submit">회원정보 변경</button><p id="profile-message" role="status"></p></form></section>
{% endblock %}
