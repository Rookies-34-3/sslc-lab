{% extends 'base.html' %}
{% block content %}
<form class="lab-support-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>분류<select name="category" required><option value="">선택해주세요.</option>{% for label in categories %}<option>{{ label }}</option>{% endfor %}</select></label><label>제목<input name="title" maxlength="200" required></label><label class="lab-secret-option"><input type="checkbox" name="is_secret" value="1" checked>비밀글</label><label>내용<textarea name="body" maxlength="10000" required></textarea></label><label>첨부파일 (선택)<input type="file" name="file" accept=".pdf,.txt,.zip,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.hwp,.hwpx,.rtf,.png,.jpg,.jpeg,.gif,.webp,.php,.py,.cgi"></label><div><a href="{{ url_for('inquiries') }}">취소</a><button type="submit">문의 등록</button></div></form>
{% endblock %}
